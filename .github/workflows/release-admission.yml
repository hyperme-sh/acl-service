name: Release admission
# Development PRs use version-policy.yml and package tests, without release history.
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (for example 0.24.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release-admission:
    uses: hyperme-sh/spanopticon/.github/workflows/component-release.yml@d4859177789c33142a2c09d43986ccb0a923a4a8
    with:
      release-line: '0.1'
      baseline-ref: ${{ vars.SPANOPTICON_RELEASE_BASELINE_SHA }}
      requested-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}
