name: Release contract tooling
on:
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on:
      group: shared-local
      labels: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Test contract and candidate integrity without private dependencies
        run: uv run --no-project --with pytest==9.0.2 python -m pytest -c /dev/null tests_tools
