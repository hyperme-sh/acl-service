name: Package release channels
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-stable-package-release
  cancel-in-progress: false
jobs:
  release-admission:
    if: github.event_name == 'push'
    uses: hyperme-sh/spanopticon/.github/workflows/component-release.yml@d4859177789c33142a2c09d43986ccb0a923a4a8
    with:
      release-line: '0.1'
      baseline-ref: ${{ vars.SPANOPTICON_RELEASE_BASELINE_SHA }}
      requested-version: ${{ github.ref_name }}
  publish:
    needs: release-admission
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'push' && needs.release-admission.result == 'success'
    runs-on: [self-hosted, linux, x64, debrunner]
    timeout-minutes: 15
    steps:
      - name: Publish exact tested stable artifacts
        uses: hyperme-sh/.github/actions/release-channel@3f6cf76bc7a866fe9eabefafc7f70420236213aa
        with:
          workflow: .github/workflows/package.yml
          token: ${{ github.token }}
