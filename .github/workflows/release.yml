name: Package release channels
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: package-release-stable-package-release
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
      actions: read
    runs-on:
      group: shared-local
      labels: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - name: Publish exact tested stable artifacts
        uses: hyperme-sh/.github/actions/release-channel@f850d9aba2310f61d7db1294eec1f8ae36b67e0c
        with:
          workflow: .github/workflows/package.yml
          token: ${{ github.token }}
