name: Immutable package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Build candidate before running repository validators
        run: uv build --out-dir "$RUNNER_TEMP/acl-candidate"
      - name: Export the exact candidate contract for source reconciliation
        run: python3 scripts/export_release_contract.py "$RUNNER_TEMP"/acl-candidate/*.whl --output "$RUNNER_TEMP/acl-candidate-contract"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-contract
          path: ${{ runner.temp }}/acl-candidate-contract/*
          if-no-files-found: error
          retention-days: 30
      - id: candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-dist
          path: ${{ runner.temp }}/acl-candidate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
  consumers:
    needs: candidate
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: ${{ runner.temp }}/acl-candidate
          merge-multiple: true
      - name: Check exact candidate without replacing it
        env:
          RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/acl-candidate
          PREPARATION_EVIDENCE_DIR: ${{ runner.temp }}/acl-prepared-evidence
        run: |
          set -euo pipefail
          expected=$(cd "$RELEASE_CANDIDATE_DIR" && sha256sum -- *.whl *.tar.gz)
          bash scripts/check-package.sh --fixtures
          (cd "$RELEASE_CANDIDATE_DIR" && sha256sum --check <<< "$expected")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check out the matching SociACL recipient contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FyberLabs/SociACL
          ref: 779c4d752c1f0afadc6b1b93b7f1f2535f3b4ffd
          path: sociacl-client
          persist-credentials: false
      - name: Exercise signed ciphertext HTTP writes with the pinned verifier
        env:
          SOCIACL_SOURCE: ${{ github.workspace }}/sociacl-client
        run: |
          npm ci --prefix admission --ignore-scripts --no-audit
          npm ci --prefix "$SOCIACL_SOURCE/typescript" --ignore-scripts --no-audit
          PYTHONPATH=tests .venv/bin/python -m pytest -p conftest -q admission/test_signed_http.py
      - name: Statement startup binding coverage
        run: |
          uv pip install --python .venv/bin/python coverage==7.6.1
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.statement_bindings -m pytest -q tests/test_statement_binding_settings.py tests/test_statement_binding_runtime.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Delegation binding unit coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.delegation_bindings -m pytest -q tests/test_delegation_binding_units.py
          .venv/bin/python -m coverage report --fail-under=100 -m
      - name: Check policy storage contract against owned PostgreSQL
        run: .venv/bin/python -m pytest -q integration --ignore=integration/nightly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-evidence
          path: ${{ runner.temp }}/acl-prepared-evidence/*
          if-no-files-found: error
          retention-days: 30
