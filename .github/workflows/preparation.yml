name: Immutable package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  consumers:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Read exact reviewed Core allocation wire source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/controlplane-core
          ref: 56401dac2aece28cb2eb029e217877826ed50127
          path: core-allocation-wire
          persist-credentials: false
      - name: Refuse drift in the independent allocation wire modules
        run: |
          cmp core-allocation-wire/src/api/domain/media_allocation_grant.py src/acl_service/allocation_protocol/media_allocation_grant.py
          cmp core-allocation-wire/src/api/domain/media_allocation_request.py src/acl_service/allocation_protocol/media_allocation_request.py
          cmp core-allocation-wire/src/api/domain/media_retirement_request.py src/acl_service/allocation_protocol/media_retirement_request.py
          cmp core-allocation-wire/src/api/domain/group_allocation_grant.py src/acl_service/allocation_protocol/group_allocation_grant.py
          cmp core-allocation-wire/src/api/domain/group_allocation_request.py src/acl_service/allocation_protocol/group_allocation_request.py
      - name: Build candidate before running repository validators
        run: uv build --out-dir "$RUNNER_TEMP/acl-candidate"
      - name: Export the exact candidate contract for source reconciliation
        run: python3 scripts/export_release_contract.py "$RUNNER_TEMP"/acl-candidate/*.whl --output "$RUNNER_TEMP/acl-candidate-contract"
      - name: Check exact candidate without replacing it
        env:
          RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/acl-candidate
          PREPARATION_EVIDENCE_DIR: ${{ runner.temp }}/acl-prepared-evidence
        run: |
          set -euo pipefail
          expected=$(cd "$RELEASE_CANDIDATE_DIR" && sha256sum -- *.whl *.tar.gz)
          bash scripts/check-package.sh --fixtures
          (cd "$RELEASE_CANDIDATE_DIR" && sha256sum --check <<< "$expected")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check out the matching SociACL recipient contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FyberLabs/SociACL
          ref: 779c4d752c1f0afadc6b1b93b7f1f2535f3b4ffd
          path: sociacl-client
          persist-credentials: false
      - name: Exercise signed ciphertext HTTP writes with the pinned verifier
        env:
          SOCIACL_SOURCE: ${{ github.workspace }}/sociacl-client
        run: |
          npm ci --prefix admission --ignore-scripts --no-audit
          npm ci --prefix "$SOCIACL_SOURCE/typescript" --ignore-scripts --no-audit
          PYTHONPATH=tests .venv/bin/python -m pytest -p conftest -q admission/test_signed_http.py
      - name: Statement startup binding coverage
        run: |
          uv pip install --python .venv/bin/python coverage==7.6.1
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.statement_bindings -m pytest -q tests/test_statement_binding_settings.py tests/test_statement_binding_runtime.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Delegation binding unit coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.delegation_bindings -m pytest -q tests/test_delegation_binding_units.py
          .venv/bin/python -m coverage report --fail-under=100 -m
      - name: Private wrap transport contract coverage (CI only)
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.interfaces.api.private_wrap_routes -m pytest -q tests/test_private_wrap_routes.py
          .venv/bin/python -m coverage report --fail-under=95 -m
      - name: Upload reconciliation unit coverage (CI only)
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.media_upload_reconcile -m pytest -q tests/test_media_upload_reconcile.py
          .venv/bin/python -m coverage report --fail-under=95 -m
      - name: Sharing reconciliation unit coverage (CI only)
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.media_share_reconcile -m pytest -q tests/test_media_share_reconcile.py
          .venv/bin/python -m coverage report --fail-under=95 -m
      - name: Private media owner transport coverage (CI only)
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.interfaces.api.media_owner_routes -m pytest -q tests/test_media_owner_routes.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Independent group transport coverage (CI only)
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.interfaces.api.media_group_routes -m pytest -q tests/test_media_group_routes.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Allocation coordinator, client, bindings and route coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.media_allocation,acl_service.infrastructure.media_allocation_client,acl_service.infrastructure.media_allocation_bindings,acl_service.interfaces.api.media_allocation_routes -m pytest -q tests/test_media_allocation.py tests/test_media_allocation_client.py tests/test_media_allocation_bindings.py tests/test_media_allocation_routes.py tests/test_media_retirement_client.py tests/test_media_retirement.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Group wrap binding and route coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.group_wrap_bindings,acl_service.interfaces.api.group_wrap_routes -m pytest -q tests/test_group_wrap_bindings.py tests/test_group_wrap_routes.py
          .venv/bin/python -m coverage report --fail-under=90 --show-missing
      - name: Group wrap coordinator and client unit coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.group_item_delivery,acl_service.domain.group_wrap,acl_service.infrastructure.group_wrap_store -m pytest -q tests/test_group_item_delivery.py tests/test_group_wrap.py tests/test_group_wrap_store.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Group allocation coordinator and transport coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.group_allocation,acl_service.infrastructure.group_allocation_client -m pytest -q tests/test_group_allocation.py tests/test_group_allocation_client.py
          .venv/bin/python -m coverage report --fail-under=90 --show-missing
      - name: Group allocation binding and route coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.group_allocation_bindings,acl_service.interfaces.api.group_allocation_routes -m pytest -q tests/test_group_allocation_bindings.py tests/test_group_allocation_routes.py
          .venv/bin/python -m coverage report --fail-under=90 --show-missing
      - name: Protected retirement adapter coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.domain.media_retirement -m pytest -q tests/test_media_retirement.py
          .venv/bin/python -m coverage report --fail-under=95 --show-missing
      - name: Active media index installer unit coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.media_active_index,acl_service.domain.media_checkpoint -m pytest -q tests/test_media_active_index.py
          .venv/bin/python -m coverage report --fail-under=95 -m
      - name: PostgreSQL binding unit coverage
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.media_postgres_settings -m pytest -q tests/test_media_postgres_settings.py tests/test_media_allocation_bindings.py
          .venv/bin/python -m coverage report --fail-under=90 -m
      - name: Check policy storage contract against owned PostgreSQL
        run: |
          .venv/bin/python -m coverage run --branch --source=acl_service.infrastructure.postgres_history_store,acl_service.infrastructure.postgres_media_provision,acl_service.infrastructure.group_allocation_journal -m pytest -q integration tests/test_postgres_history_units.py tests/test_group_allocation_journal.py --ignore=integration/nightly
          .venv/bin/python -m coverage report --fail-under=85 -m
