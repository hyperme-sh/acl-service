name: Device transfer authority contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FyberLabs/SociACL
          ref: 16ee447e4ca21b98d1c2042eb33133b3a3785b03
          path: sociacl-transfer-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: hyperme-sh/controlplane-sdk
          ref: 006611d80fe60b303288447204271cde5ba35332
          path: sdk-transfer-source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix admission --ignore-scripts --no-audit
      - run: npm ci --prefix sociacl-transfer-source/typescript/ids && npm run --prefix sociacl-transfer-source/typescript/ids build
      - run: npm ci --prefix sdk-transfer-source/packages/sea-device-link && npm run --prefix sdk-transfer-source/packages/sea-device-link build
      - run: node browser/device-transfer/check.mjs
        env:
          SOCIACL_SOURCE: ${{ github.workspace }}/sociacl-transfer-source
          SDK_SOURCE: ${{ github.workspace }}/sdk-transfer-source
