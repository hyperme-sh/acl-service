name: Standalone package
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: acl-moving-test
  cancel-in-progress: false
jobs:
  source:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Validate public source without inherited credentials
        run: |
          bash scripts/anonymous-command.sh bash -euo pipefail <<'CHECK'
          uv lock --check
          uv sync --frozen
          uv run --frozen pytest
          CHECK
  package:
    needs: source
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Prepare job-local candidate
        run: |
          candidate=$(mktemp -d "$RUNNER_TEMP/acl-candidate.XXXXXX")
          echo "RELEASE_CANDIDATE_DIR=$candidate" >> "$GITHUB_ENV"
          bash scripts/anonymous-command.sh uv build --no-sources --out-dir "$candidate"
      - name: Qualify exact package and owned storage contracts
        run: |
          bash scripts/anonymous-command.sh env GITHUB_ACTIONS="$GITHUB_ACTIONS" RELEASE_CANDIDATE_DIR="$RELEASE_CANDIDATE_DIR" bash -euo pipefail <<'CHECK'
          expected=$(cd "$RELEASE_CANDIDATE_DIR" && sha256sum -- *.whl *.tar.gz)
          bash scripts/check-package.sh
          bash scripts/check-postgres.sh
          (cd "$RELEASE_CANDIDATE_DIR" && sha256sum --check <<< "$expected")
          CHECK
      - name: Remove job-local candidate
        if: always()
        run: rm -rf -- "$RELEASE_CANDIDATE_DIR"
  image:
    if: github.repository == 'hyperme-sh/acl-service'
    needs: package
    permissions:
      contents: read
      packages: write
    outputs:
      image-id: ${{ steps.publish.outputs.image-id }}
      digest: ${{ steps.publish.outputs.digest }}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build and qualify public runtime
        run: |
          image="ghcr.io/hyperme-sh/acl-service/runtime:preparation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "QUALIFIED_IMAGE=$image" >> "$GITHUB_ENV"
          bash scripts/anonymous-command.sh docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" --label org.opencontainers.image.source=https://github.com/hyperme-sh/acl-service -t "$image" .
          bash scripts/anonymous-command.sh bash scripts/check-image.sh "$image"
      - name: Publish qualified current main to moving TEST
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'Superseded main; skip moving TEST publication'
            exit 0
          fi
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/acl-registry.XXXXXX")
          output=$(mktemp "$RUNNER_TEMP/acl-published.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG" "$output"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GH_TOKEN
          image_id=$(docker image inspect "$QUALIFIED_IMAGE" --format '{{.Id}}')
          python3 scripts/publish_container.py --revision "$GITHUB_SHA" --image-id "$image_id" --channel test --publish > "$output"
          cat "$output"
          python3 - "$output" "$GITHUB_OUTPUT" <<'OUTPUT'
          import json, re, sys
          rows = [json.loads(line) for line in open(sys.argv[1]) if line.startswith('{"published":')]
          row, = rows
          digest, = row['registry_digests']
          assert re.fullmatch(r'ghcr.io/hyperme-sh/acl-service/runtime@sha256:[a-f0-9]{64}', digest)
          with open(sys.argv[2], 'a') as target:
              target.write('image-id=' + row['image_id'] + '\ndigest=' + digest + '\n')
          OUTPUT
      - name: Remove qualified local image
        if: always()
        run: docker image rm "$QUALIFIED_IMAGE" >/dev/null 2>&1 || true
  runtime-replay:
    needs: image
    if: needs.image.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pull and replay exact qualified GHCR bytes
        env:
          GHCR_TOKEN: ${{ github.token }}
          QUALIFIED_DIGEST: ${{ needs.image.outputs.digest }}
          EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          set -euo pipefail
          [[ "$QUALIFIED_DIGEST" =~ ^ghcr.io/hyperme-sh/acl-service/runtime@sha256:[a-f0-9]{64}$ ]]
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/acl-replay.XXXXXX")
          trap 'docker image rm "$QUALIFIED_DIGEST" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset GHCR_TOKEN
          docker pull "$QUALIFIED_DIGEST"
          test "$(docker image inspect "$QUALIFIED_DIGEST" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          bash scripts/anonymous-command.sh bash scripts/check-image.sh "$EXPECTED_IMAGE_ID"
          bash scripts/anonymous-command.sh python3 scripts/check-runtime-startup.py "$EXPECTED_IMAGE_ID"
  retained-images:
    needs: runtime-replay
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/historical-images.yml
