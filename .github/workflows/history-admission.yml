name: History admission
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit
        working-directory: admission
      - run: PYTHONPATH=../src python3 -m unittest -v test_admission test_history_freshness test_statement_source test_statement_graph test_delegation_source
        working-directory: admission
      - name: Statement transaction unit coverage
        working-directory: admission
        run: |
          python3 -m venv "$RUNNER_TEMP/statement-coverage"
          "$RUNNER_TEMP/statement-coverage/bin/pip" install coverage==7.6.1
          PYTHONPATH=../src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=statement_source -m unittest test_statement_source
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report -m
      - name: Statement quota unit coverage
        run: node --test --test-isolation=none --experimental-test-coverage admission/statement-quota.test.mjs
      - name: Protected media transaction contracts and coverage (CI only)
        working-directory: admission
        run: |
          PYTHONPATH=../src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=media_source -m unittest test_media_source
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report --fail-under=90 -m
      - name: Delegation verifier contract coverage (CI only)
        run: >-
          node --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=admission/delegation-graph.mjs
          --test-coverage-lines=90 --test-coverage-branches=75
          admission/delegation-graph.test.mjs
      - name: Delegation storage adapter coverage (CI only)
        working-directory: admission
        run: |
          PYTHONPATH=../src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=delegation_source -m unittest test_delegation_source
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report --fail-under=100 -m
      - name: Statement binding configuration unit coverage
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=acl_service.infrastructure.statement_bindings -m unittest discover -s tests -p test_statement_binding_settings.py
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report -m
      - name: Native epoch adapter unit coverage
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=acl_service.infrastructure.epoch_verifier -m unittest discover -s tests -p test_epoch_verifier.py
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report --fail-under=100 -m
      - name: Private wrap storage unit coverage
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=acl_service.infrastructure.private_wrap_store -m unittest discover -s tests -p test_private_wrap_store.py
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report --fail-under=95 -m
      - name: Private wrap HTTP contract (CI only)
        run: |
          "$RUNNER_TEMP/statement-coverage/bin/pip" install httpx==0.28.1
          PYTHONPATH=src "$RUNNER_TEMP/statement-coverage/bin/python" -m unittest discover -s admission -p test_private_wrap_http.py
      - name: Private wrap delivery fence coverage
        run: |
          PYTHONPATH=src "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage run --branch --source=acl_service.domain.private_wrap_delivery -m unittest discover -s tests -p test_private_wrap_delivery.py
          "$RUNNER_TEMP/statement-coverage/bin/python" -m coverage report --fail-under=95 -m
      - name: Rust epoch verifier cross-language contract (CI only)
        run: |
          set -euo pipefail
          image="acl-epoch-contract:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -f admission/epoch-fixture.json' EXIT
          node admission/epoch-fixture.mjs > admission/epoch-fixture.json
          docker build --target epoch-contract -t "$image" .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges "$image"
      - name: Protected media source native identity contract (CI only)
        run: |
          set -euo pipefail
          image="acl-media-contract:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -f admission/media-native-fixture.json' EXIT
          node admission/media-native-fixture.mjs > admission/media-native-fixture.json
          docker build --target media-contract -t "$image" .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=32m --cap-drop ALL --security-opt no-new-privileges "$image"
