[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acl-service"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0813448d067d59a0cc8fa2d144d85ddfde465af4",
    "auth-service @ git+https://github.com/hyperme-sh/auth-service.git@5db7eb7753d61831e709910c0c940524209c32a7",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@d5e658e1a139b58718a1dc1a5a532efd63d4f01c",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@907b9390b3d68aa67903ffec849e9f1d64c17f1f",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@41bac4f366eeeedae47a0ada18d89f3dee1ca608",
    "casbin>=1.36.0",
    "casbin-sqlalchemy-adapter>=1.4.0",
    "cryptography>=46.0.0",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@9a9bbb20c2e0cd41febf3233ce7a48fe17a84b04",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@14355f230e15a5acf3b1283e87d5f65aceff35ba",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acl_service"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/NOTICE", "/notices", "/tests_artifacts", "/src", "/tests", "/integration", "/scripts", "/tests_tools", "/releases", "/pyproject.toml", "/uv.lock", "/README.md", "/Dockerfile", "/.dockerignore"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
override-dependencies = ["controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@41bac4f366eeeedae47a0ada18d89f3dee1ca608", "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@14355f230e15a5acf3b1283e87d5f65aceff35ba"]
